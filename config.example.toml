# mistan configuration example. See README for the per-user config directory.
# Prefer MISTAN_API_KEY over storing an API key in a provider entry.

# Default: mistl AI network. Configure its providers, Room connections,
# sharing, default_ref/tts/stt in mistl; they are not duplicated here.
# mistan starts `mistl ai serve start` and discovers its address automatically.
backend = "mistl"
network_model = "" # raw model id; empty lets mistl choose
# Native tools, with automatic fallback to prompt for unsupported tools.
tool_mode = "native"
providers = []

# Custom HTTP connections: replace backend and providers above, then add
# default_ref. The same model id at two providers is a different reference.
# backend = "custom"
# default_ref = { provider_id = "http-1", model = "model-id" }
# [[providers]]
# id = "http-1"
# label = "My connection"
# base_url = "https://example.invalid/v1"
# api_key = "" # preferably supplied through MISTAN_API_KEY
# enabled = true # omitted means true; disabled references are kept
# models = ["model-id"] # optional cache; refreshed when the picker opens

# Global options belong before any [[providers]] table.
# reasoning_effort = "medium" # task/session setting; never temperature
# mistl_bin = "mistl" # name on PATH or full path
# mistl_instance = "dev" # passed as `mistl --instance <name>`
# mistl_timeout_secs = 60
# just_bin = "just" # name on PATH or full path
# command_timeout_secs = 600 # foreground recipes / shell commands
# max_steps = 12 # model round-trips per message
# auto_approve = false # allow state-changing commands without asking
