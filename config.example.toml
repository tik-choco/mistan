# mistan configuration example.
# Copy to %APPDATA%\mistan\config.toml (Windows) or ~/.config/mistan/config.toml
# (Linux; ~/Library/Application Support/mistan/config.toml on macOS).
# Prefer the MISTAN_API_KEY environment variable over writing api_key here.

# Default: mistl AI network (no key). mistan runs `mistl ai serve start`
# automatically and discovers the selected instance's API address.
# Needs a reachable provider, e.g. a node running `mistl ai provide start`.
# backend = "mistl"   # explicit backend wins over any base_url
model = ""            # empty = let the server choose
# Native tools when the network provider advertises "tools" (mistl providers do).
# Automatically falls back to prompt mode for providers without tool support.
tool_mode = "native"
# tool_mode = "prompt"  # forces prompt mode

# Custom OpenAI-compatible provider with tool calling (key via MISTAN_API_KEY):
# Setting base_url selects custom unless backend is explicit.
# backend = "custom"  # requires base_url; replace an explicit "mistl" backend
# base_url = "https://api.openai.com/v1"
# model = "gpt-4.1-mini"
# tool_mode = "native"

# Local Ollama:
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3:8b"
# tool_mode = "native"

# reasoning_effort = "medium"  # none | minimal | low | medium | high | xhigh (ignored on the mistl AI network)
# temperature = 0.2
# mistl_bin = "mistl"           # name on PATH or full path to mistl(.exe)
# mistl_instance = "dev"        # passed as `mistl --instance <name>`
# mistl_timeout_secs = 60
# max_steps = 12                # model round-trips per message
# auto_approve = false          # run state-changing mistl commands without asking
