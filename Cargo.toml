[package]
name = "mistan"
version = "0.1.0"
edition = "2024"
description = "Natural-language TUI agent that operates the mistl daemon CLI as a tool"
license = "MPL-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
